name: Apply F-789SGA core batch
on:
  push:
    paths:
      - '.github/workflows/f789-core-batch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current emulator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          replacements = [
            ('data-action="calc"><span class="sub o">Solve</span>CALC', 'data-action="calc" data-shift="solve"><span class="sub o">Solve</span>CALC'),
            ('data-action="inv"><span class="sub o">x!</span>x⁻¹', 'data-action="inv" data-shift="x!"><span class="sub o">x!</span>x⁻¹'),
            ('data-action="fraction"><span class="sub b">d/c↔a b/c</span>F↔D', 'data-action="fraction" data-alpha-action="fractionToggle"><span class="sub b">d/c↔a b/c</span>F↔D'),
            ('data-action="log"><span class="sub b">10ⁿ</span>log', 'data-action="log" data-alpha-action="pow10"><span class="sub b">10ⁿ</span>log'),
            ('data-action="ln"><span class="sub b">eⁿ</span>ln', 'data-action="ln" data-alpha-action="expE"><span class="sub b">eⁿ</span>ln'),
            ('data-action="rcl"><span class="sub o">STO</span>RCL', 'data-action="rcl" data-shift="sto"><span class="sub o">STO</span>RCL'),
            ('data-action="fraction" data-shift="fraction"><span class="sub o">a b/c↔d/c</span><span class="sub b" style="top:-5px">Y</span>F↔D', 'data-action="fraction" data-shift="fraction" data-alpha="Y"><span class="sub o">a b/c↔d/c</span><span class="sub b" style="top:-5px">Y</span>F↔D'),
            ('id="ansTop" data-shift="drg"', 'id="ansTop" data-alpha-action="drg"'),
            ('id="ans" data-shift="drg"', 'id="ans" data-alpha-action="drg"'),
            ('data-v="e" data-shift="sum"', 'data-action="exp" data-shift="sum"'),
            ('data-v="e" data-shift="pi" data-alpha="e"', 'data-action="exp" data-shift="pi" data-alpha="e"'),
          ]
          for a,b in replacements:
              s=s.replace(a,b)
          s=s.replace('let expr="",ans=0,memory=0,shift=false,alpha=false,mode="COMP",angle="DEG",io="MATH",display="NORM1",fractionMode="d/c",history=[],histPos=-1;', 'let expr="",ans=0,memory=0,shift=false,alpha=false,hypPending=false,storePending=false,rclPending=false,mode="COMP",angle="DEG",io="MATH",display="NORM1",fractionMode="d/c",history=[],histPos=-1;')
          s=s.replace('const V={A:0,B:0,C:0,D:0,X:0,Y:0,M:0};', 'const V={A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0};')
          core = r'''function implicit(s){
 s=s.replace(/(\d|\)|π|Ans|[A-FMXY])(?=(π|Ans|[A-FMXY]|\(|sin|cos|tan|log|ln|Abs|√|sinh|cosh|tanh|sin⁻¹|cos⁻¹|tan⁻¹))/g,"$1*");
 return s;
}
function dmsToDecimal(s){return s.replace(/(\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)′(\d+(?:\.\d+)?)″/g,(m,d,mi,se)=>String(+d+(+mi)/60+(+se)/3600))}
function transform(src){
 let s=dmsToDecimal(src).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
 s=s.replace(/(\d+(?:\.\d+)?)[Ee]([+-]?\d+)/g,"$1§$2");
 s=s.replace(/FAC\(/g,"¤("); s=implicit(s); s=s.replace(/¤\(/g,"FAC(");
 s=s.replace(/\be\b/g,"C_E").replace(/§/g,"e");
 s=s.replace(/π/g,"P").replace(/Ans/g,"N"); Object.keys(V).forEach(k=>{s=s.replace(new RegExp("\\b"+k+"\\b","g"),"V"+k)});
 s=s.replace(/sin⁻¹/g,"AS").replace(/cos⁻¹/g,"AC").replace(/tan⁻¹/g,"AT");
 s=s.replace(/sinh/g,"SH").replace(/cosh/g,"CH").replace(/tanh/g,"TH");
 s=s.replace(/sin/g,"S").replace(/cos/g,"C").replace(/tan/g,"T").replace(/log/g,"L").replace(/ln/g,"G").replace(/Abs/g,"AB").replace(/√/g,"Q");
 s=s.replace(/(\d+(?:\.\d+)?)!/g,"FAC($1)").replace(/\^/g,"**"); return s;
}
function evalExpr(s){let js=transform(s);if(!/^[0-9A-Za-z_+*/%().,\s*-]+$/.test(js))throw Error();return Function("P","N","VA","VB","VC","VD","VE","VF","VX","VY","VM","C_E","S","C","T","AS","AC","AT","L","G","AB","Q","SH","CH","TH","FAC","return ("+js+")")(Math.PI,ans,V.A,V.B,V.C,V.D,V.E,V.F,V.X,V.Y,V.M,Math.E,x=>Math.sin(rad(x)),x=>Math.cos(rad(x)),x=>Math.tan(rad(x)),x=>fromRad(Math.asin(x)),x=>fromRad(Math.acos(x)),x=>fromRad(Math.atan(x)),Math.log10,Math.log,Math.abs,Math.sqrt,Math.sinh,Math.cosh,Math.tanh,fact)}
'''
          s=re.sub(r'function implicit\(s\)\{.*?function toRadExpr', core.strip()+'\nfunction toRadExpr', s, count=1, flags=re.S)
          shift_fn = r'''function doShift(action){
 if(action==="sto"){storePending=true;rclPending=false;return} if(action==="x!")return postfixFactorial();
 if(action==="asin")add("sin⁻¹(");else if(action==="acos")add("cos⁻¹(");else if(action==="atan")add("tan⁻¹(");
 else if(action==="fraction"){fractionMode=fractionMode==="d/c"?"a b/c":"d/c";$("result").textContent=fraction(ans)}
 else if(action==="mminus"){memory-=ans;render()} else if(action==="sum")app("Σ"); else if(action==="drg"){angle=angle==="DEG"?"RAD":angle==="RAD"?"GRAD":"DEG";render()}
 else if(action==="round")$("result").textContent=Math.round(ans); else if(action==="rand"){ans=Math.random();$("result").textContent=ans.toFixed(3)} else if(action==="pi")add("π");
 else if(action==="eng"){if(ans===0)$("result").textContent="0";else{const p=Math.floor(Math.log10(Math.abs(ans))/3)*3;$("result").textContent=(ans/10**p)+"×10^"+p}}
 else if(action==="solve")solve(); else if(action==="npr")app("nPr"); else if(action==="ncr")app("nCr"); else if(action==="pol")app("Pol"); else if(action==="rec")app("Rec")}
function postfixFactorial(){if(!expr)expr=String(ans);expr="FAC("+expr+")";render()}
function alphaAction(a){if(a==="pow10")add("10^(");else if(a==="expE")add("e^(");else if(a==="fractionToggle"){fractionMode=fractionMode==="d/c"?"a b/c":"d/c";render()}else if(a==="drg"){angle=angle==="DEG"?"RAD":angle==="RAD"?"GRAD":"DEG";render()}}
'''
          s=re.sub(r'function doShift\(action\)\{.*?function pressButton', shift_fn.strip()+'\nfunction pressButton', s, count=1, flags=re.S)
          press_fn = r'''function pressButton(b){
 const alphaVal=b.dataset.alpha,shiftVal=b.dataset.shift,alphaFn=b.dataset.alphaAction;
 if(storePending&&alphaVal!==undefined){V[alphaVal]=expr?evalExpr(expr):ans;storePending=false;alpha=false;render();return} if(rclPending&&alphaVal!==undefined){add(String(V[alphaVal]));rclPending=false;alpha=false;render();return}
 if(alpha&&alphaFn){alpha=false;alphaAction(alphaFn);render();return} if(alpha&&alphaVal!==undefined){add(alphaVal);alpha=false;render();return}
 if(shift&&shiftVal!==undefined){shift=false;doShift(shiftVal);render();return} const a=b.dataset.action;
 if(a==="calc"){if(expr)calculate();return} if(a==="inv")return postfixInverse(); if(a==="fraction"){$("result").textContent=fraction(ans);return} if(a==="eng")return doShift("eng"); if(a==="sqrt")return add("√("); if(a==="square")return postfixPower(2); if(a==="cube")return postfixPower(3); if(a==="log")return add("log("); if(a==="ln")return add("ln("); if(a==="neg")return add("−");
 if(a==="dms"){if(!expr)return;if(!expr.includes("°"))expr+="°";else if(!expr.includes("′"))expr+="′";else if(!expr.includes("″"))expr+="″";render();return} if(a==="hyp"){hypPending=true;render();return} if(a==="sin"||a==="cos"||a==="tan"){const fn=hypPending?({sin:"sinh",cos:"cosh",tan:"tanh"}[a]):a;hypPending=false;add(fn+"(");return} if(a==="rcl"){rclPending=true;storePending=false;render();return} if(a==="abs")return add("Abs("); if(a==="mplus"){memory+=(expr?evalExpr(expr):ans);render();return} if(a==="exp")return add("E"); if(b.dataset.v!==undefined)add(b.dataset.v)}
function postfixInverse(){if(!expr)expr=String(ans);expr="1/("+expr+")";render()} function postfixPower(n){if(!expr)expr=String(ans);expr="("+expr+")^"+n;render()}
'''
          s=re.sub(r'function pressButton\(b\)\{.*?document.querySelectorAll', press_fn.strip()+'\ndocument.querySelectorAll', s, count=1, flags=re.S)
          s=s.replace('document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>pressButton(b));\ndocument.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>pressButton(b));','document.querySelectorAll("[data-v],[data-action],[data-alpha-action]").forEach(b=>b.onclick=()=>pressButton(b));')
          s=s.replace('function allClear(){expr="";ans=0;memory=0;Object.keys(V).forEach(k=>V[k]=0);$("result").textContent="0";render()}','function allClear(){expr="";ans=0;memory=0;Object.keys(V).forEach(k=>V[k]=0);shift=false;alpha=false;hypPending=false;storePending=false;rclPending=false;$("result").textContent="0";render()}')
          p.write_text(s)
          PY
          node --check <(python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();print(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix F-789SGA core key behavior [skip ci]' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/f789-core-batch.yml
          git add .github/workflows/f789-core-batch.yml
          git commit -m 'Remove temporary emulator patch workflow [skip ci]' || true
          git push || true
