name: Apply F-789SGA Batch 2

on:
  push:
    paths:
      - 'tools/f789_batch2_patch.py'
      - '.github/workflows/f789-batch2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply idempotent Batch 2 patch
        run: python tools/f789_batch2_patch.py

      - name: Verify patch markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'pow10': 'data-shift="pow10"',
              'powe': 'data-shift="powe"',
              'npr': 'data-shift="npr"',
              'ncr': 'data-shift="ncr"',
              'EXP dispatch': 'else if(a==="exp")add("E")',
              'scientific parser': '10**($2)',
          }
          missing = [name for name, marker in checks.items() if marker not in s]
          if missing:
              raise SystemExit('Missing Batch 2 markers: ' + ', '.join(missing))
          print('Batch 2 marker verification passed')
          PY

      - name: Commit applied patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already contains Batch 2; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement F-789SGA Batch 2 secondary functions'
          git push
