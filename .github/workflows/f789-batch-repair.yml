name: F-789SGA batch repair

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/f789_patch.py'
      - 'tools/test_f789.mjs'
      - '.github/workflows/f789-batch-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply checked Batch 1 patch
        run: python3 tools/f789_patch.py

      - name: Static JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline calculator script found')
          Path('/tmp/f789.js').write_text(scripts[-1], encoding='utf-8')
          print('Extracted inline JS:', len(scripts[-1]), 'bytes')
          PY
          node --check /tmp/f789.js

      - name: Runtime smoke tests for checked functions
        run: |
          node tools/test_f789.mjs > /tmp/f789-test.log 2>&1

      - name: Preserve runtime test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f789-batch-test-log
          path: /tmp/f789-test.log
          if-no-files-found: warn

      - name: Commit repaired emulator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Fix F-789SGA Shift key dispatch [skip ci]'
          git push
