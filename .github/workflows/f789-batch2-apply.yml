name: Apply F-789SGA Batch 2

on:
  push:
    paths:
      - 'tools/f789_batch2_patch.py'
      - 'tools/test_f789_batch2.mjs'
      - '.github/workflows/f789-batch2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  KNOWN_GOOD_INDEX: f08a3dd446711e4b1def8e09931588d91cf3dc25

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent Batch 2 patch
        run: python tools/f789_batch2_patch.py

      - name: Run Batch 2 runtime regression tests
        run: node tools/test_f789_batch2.mjs

      - name: Commit verified Batch 2
        if: success()
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already contains the verified Batch 2 patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement verified F-789SGA Batch 2 secondary functions'
          git push

      - name: Roll back unverified Batch 2
        if: failure()
        run: |
          git checkout "$KNOWN_GOOD_INDEX" -- index.html
          if git diff --quiet -- index.html; then
            echo 'index.html is already at the known-good version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Revert unverified F-789SGA Batch 2 patch'
          git push
