name: Apply F-789SGA patch

on:
  push:
    paths:
      - 'index.html'
      - 'tools/f789_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/f789_patch.py

      - name: Verify HTML script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/f789.js').write_text(scripts[-1], encoding='utf-8')
          print('Inline JS extracted:', len(scripts[-1]), 'bytes')
          PY
          node --check /tmp/f789.js

      - name: Commit patched emulator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No patch changes were necessary.'
            exit 0
          fi
          git commit -m 'Fix F-789SGA Shift key dispatch [skip ci]'
          git push
