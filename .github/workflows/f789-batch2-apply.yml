name: Apply F-789SGA Batch 2

on:
  push:
    paths:
      - 'tools/f789_batch2_patch.py'
      - 'tools/test_f789_batch2.mjs'
      - '.github/workflows/f789-batch2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply idempotent Batch 2 patch
        run: python tools/f789_batch2_patch.py

      - name: Run Batch 2 runtime regression tests
        run: node tools/test_f789_batch2.mjs

      - name: Commit applied patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already contains Batch 2; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement F-789SGA Batch 2 secondary functions'
          git push
