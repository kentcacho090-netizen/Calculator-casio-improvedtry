<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Canon F-789SGA Emulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#d7d9da;color:#111;font-family:Arial,sans-serif}
body{min-height:100vh;padding:14px 8px;display:flex;justify-content:center}
.calc{width:min(390px,96vw);background:linear-gradient(#f2f2ef,#d7d8d6);border:2px solid #8d8f90;border-radius:14px;padding:8px;box-shadow:0 10px 28px #000;position:relative}
.solar{width:58%;height:27px;margin:auto;border:1px solid #555;background:repeating-linear-gradient(90deg,#101214 0 11px,#292d30 11px 13px)}
.head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:#222}.canon{font-size:21px;font-weight:800}.model{font-size:11px}
.lcd{height:102px;margin:2px 5px 7px;background:#dce6d7;border:5px solid #111;border-radius:8px;padding:5px 8px;font-family:monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.status{height:14px;font-size:10px;white-space:nowrap}.expr{height:25px;text-align:right;white-space:nowrap;overflow:hidden}.result{height:28px;text-align:right;font-size:22px;white-space:nowrap;overflow:hidden}
.controls{height:104px;position:relative;margin:0 3px}.k{position:relative;border:2px solid #222;border-radius:7px;background:linear-gradient(#fdfdfb,#e5e5df);color:#171717;font-weight:700;box-shadow:0 2px 2px #0005;touch-action:manipulation;cursor:pointer}.k:active{transform:scale(.96);filter:brightness(.9)}
.sub{position:absolute;top:-14px;left:1px;right:1px;font-size:8px;text-align:center;white-space:nowrap;overflow:visible;line-height:10px;font-weight:700;z-index:3}.o{color:#e5a027}.b{color:#55a8dc}.g{color:#58a05d}.red{color:#d13b36}
.dark{background:#3b3e3d;color:#fff}.shift,.alpha{background:#222;color:#fff}.shift{color:#e5a027}.alpha{color:#55a8dc}.blankkey{font-size:0}.nav{background:#35393c;color:#fff;border-radius:50%;font-size:16px}.activeS{box-shadow:inset 0 0 0 2px #e5a027,0 0 8px #e5a02788}.activeA{box-shadow:inset 0 0 0 2px #55a8dc,0 0 8px #55a8dc88}
.ctrl{position:absolute;width:16%;height:40px}.c1{left:0;top:0}.c2{left:18.5%;top:0}.c3{left:42%;top:0}.c4{right:16%;top:0}.c5{right:0;top:0}.apps{left:0;top:48px}.left{left:31%;top:40px}.right{left:51%;top:40px}.down{left:42%;top:59px}.convt{right:0;top:48px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:19px 3px 7px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 3px 8px}.fn{height:43px;font-size:11px;padding:12px 1px 2px;background:linear-gradient(#f7f7f3,#d7d8d4)}.num{height:46px;font-size:19px;padding-top:11px;background:linear-gradient(#fafaf7,#deded9)}.op{font-size:18px}
.overlay{position:absolute;inset:0;background:#111b;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;border-radius:19px;z-index:20}.overlay.show{display:flex}.panel{width:86%;background:#e8e9e3;border:2px solid #666;border-radius:10px;padding:11px;box-shadow:0 10px 30px #0009}.panel h3{margin:0 0 8px;font-size:14px}.choice{display:block;width:100%;padding:9px;margin:3px 0;border:1px solid #888;border-radius:5px;background:#f5f5ef;text-align:left;font-weight:700}.cancel{width:100%;padding:8px;margin-top:5px;border:0;border-radius:5px;background:#4b4f51;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="calc" id="calc">
<div class="solar"></div><div class="head"><span class="canon">Canon</span><span class="model">F-789SGA</span></div>
<div class="lcd"><div class="status" id="status">MATH  COMP  DEG</div><div class="expr" id="expr"></div><div class="result" id="result">0</div></div>
<div class="controls">
<button class="k ctrl c1 dark shift blankkey" id="shift"><span class="sub o">Shift</span></button>
<button class="k ctrl c2 dark alpha blankkey" id="alpha"><span class="sub b">Alpha</span></button>
<button class="k ctrl c3 nav" id="up">▲</button>
<button class="k ctrl c4 dark" id="mode"><span class="sub o">SET-UP</span>MODE</button>
<button class="k ctrl c5 dark" id="on">ON</button>
<button class="k ctrl apps blankkey" id="apps"><span class="sub o">Apps</span></button>
<button class="k ctrl left nav" id="left">◀</button><button class="k ctrl right nav" id="right">▶</button>
<button class="k ctrl down nav" id="down">▼</button><button class="k ctrl convt" id="convt"><span class="sub g">G↔T</span>CONVT</button>
</div>
<div class="grid6">
<button class="k fn" data-action="calc"><span class="sub o">Solve</span>CALC</button>
<button class="k fn" data-action="inv" data-shift="x!"><span class="sub o">x!</span>x⁻¹</button>
<button class="k fn" data-action="fraction"><span class="sub b">d/c↔a b/c</span>F↔D</button>
<button class="k fn" data-action="eng"><span class="sub o">↔ENG</span>ENG</button>
<button class="k fn" data-v="÷" data-base="DEC"><span class="sub g">DEC</span>÷</button>
<button class="k fn" data-action="sqrt" data-base="HEX"><span class="sub g">HEX</span>√</button>
</div>
<div class="grid6">
<button class="k fn" data-action="square" data-base="BIN"><span class="sub g">BIN</span>x²</button>
<button class="k fn" data-action="cube" data-base="OCT"><span class="sub g">OCT</span>x³</button>
<button class="k fn" data-action="log" data-shift="pow10"><span class="sub b">10ⁿ</span>log</button>
<button class="k fn" data-action="ln" data-shift="powe"><span class="sub b">eⁿ</span>ln</button>
<button class="k fn" data-action="neg" data-alpha="A"><span class="sub b">A</span>(−)</button>
<button class="k fn" data-action="dms" data-alpha="B"><span class="sub b">B</span>°′″</button>
</div>
<div class="grid6">
<button class="k fn" data-action="hyp" data-alpha="C"><span class="sub b">C</span>hyp</button>
<button class="k fn" data-action="sin" data-shift="asin" data-alpha="D"><span class="sub o">sin⁻¹</span><span class="sub b" style="top:-5px">D</span>sin</button>
<button class="k fn" data-action="cos" data-shift="acos" data-alpha="E"><span class="sub o">cos⁻¹</span><span class="sub b" style="top:-5px">E</span>cos</button>
<button class="k fn" data-action="tan" data-shift="atan" data-alpha="F"><span class="sub o">tan⁻¹</span><span class="sub b" style="top:-5px">F</span>tan</button>
<button class="k fn" data-action="rcl" data-shift="sto"><span class="sub o">STO</span>RCL</button>
<button class="k fn" data-action="abs" data-shift="percent"><span class="sub o">%</span>Abs</button>
</div>
<div class="grid6">
<button class="k fn" data-v="(" data-shift="percent"><span class="sub o">%</span>(</button>
<button class="k fn" data-v=")" data-shift="," data-alpha="X"><span class="sub o">,</span><span class="sub b" style="top:-5px">X</span>)</button>
<button class="k fn" data-action="fraction" data-shift="fraction"><span class="sub o">a b/c↔d/c</span><span class="sub b" style="top:-5px">Y</span>F↔D</button>
<button class="k fn" data-action="mplus" data-shift="mminus" data-alpha="M"><span class="sub o">M−</span><span class="sub b" style="top:-5px">M</span>M+</button>
<button class="k fn" data-action="exp" data-shift="sum"><span class="sub g">Σ</span>EXP</button>
<button class="k fn" id="ansTop" data-shift="drg"><span class="sub b">DRG▶</span>Ans</button>
</div>
<div class="grid5">
<button class="k num" data-v="7">7</button><button class="k num" data-v="8">8</button><button class="k num" data-v="9">9</button><button class="k num" id="del"><span class="sub o">CLR</span>DEL</button><button class="k num red" id="ca"><span class="sub o">OFF</span>CA</button>
</div>
<div class="grid5"><button class="k num" data-v="4">4</button><button class="k num" data-v="5">5</button><button class="k num" data-v="6">6</button><button class="k num op" data-v="×" data-shift="npr"><span class="sub o">nPr</span>×</button><button class="k num op" data-v="÷" data-shift="ncr"><span class="sub o">nCr</span>÷</button></div>
<div class="grid5"><button class="k num" data-v="1">1</button><button class="k num" data-v="2">2</button><button class="k num" data-v="3">3</button><button class="k num op" data-v="+" data-shift="pol"><span class="sub o">Pol(</span>+</button><button class="k num op" data-v="−" data-shift="rec"><span class="sub o">Rec(</span>−</button></div>
<div class="grid5"><button class="k num" data-v="0" data-shift="round"><span class="sub o">ROUND</span>0</button><button class="k num" data-v="." data-shift="rand"><span class="sub o">Rand i-Rand</span>.</button><button class="k num" data-action="exp" data-shift="pi" data-alpha="e"><span class="sub o">π</span><span class="sub b" style="top:-5px">e</span>EXP</button><button class="k num" id="ans" data-shift="drg"><span class="sub b">DRG▶</span>Ans</button><button class="k num op" id="equals">=</button></div>
<div class="overlay" id="overlay"><div class="panel"><h3 id="title">MODE</h3><div id="choices"></div><button class="cancel" id="cancel">CANCEL</button></div></div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let expr="",ans=0,memory=0,shift=false,alpha=false,mode="COMP",angle="DEG",io="MATH",display="NORM1",fractionMode="d/c",history=[],histPos=-1,baseMode="DEC";
const V={A:0,B:0,C:0,D:0,X:0,Y:0,M:0};
const rad=x=>angle==="DEG"?x*Math.PI/180:angle==="GRAD"?x*Math.PI/200:x;
const fromRad=x=>angle==="DEG"?x*180/Math.PI:angle==="GRAD"?x*200/Math.PI:x;
function render(){
  $("status").textContent=(shift?"S ":"")+(alpha?"A ":"")+(memory!==0?"M ":"")+mode+(mode==="BASE"?" "+baseMode:" "+angle)+(io==="LINE"?" LINE":"")+" "+(display==="FIX"?" FIX":display==="SCI"?" SCI":"");
  $("expr").textContent=expr;
  $("shift").classList.toggle("activeS",shift);$("alpha").classList.toggle("activeA",alpha);
}
function add(s){expr+=s;render()}
function clearEntry(){expr="";$("result").textContent="0";render()}
function allClear(){expr="";ans=0;memory=0;Object.keys(V).forEach(k=>V[k]=0);$("result").textContent="0";render()}
function gcd(a,b){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));while(b){let t=a%b;a=b;b=t}return a}
function lcm(a,b){return Math.abs(a/gcd(a,b)*b)}
function fact(n){n=Math.trunc(n);if(n<0||n>170)throw Error();let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function npr(n,r){if(r<0||r>n)throw Error();return fact(n)/fact(n-r)}
function ncr(n,r){return npr(n,r)/fact(r)}
function formatNumber(x){
 if(!Number.isFinite(x))throw Error();
 if(display==="FIX")return x.toFixed(window.fixDigits??2);
 if(display==="SCI")return x.toExponential(window.sciDigits??6);
 if(display==="NORM2" && Math.abs(x)>=1e-9 && Math.abs(x)<1e10)return String(Number(x.toPrecision(12)));
 if(display==="NORM1" && Math.abs(x)>=1e-2 && Math.abs(x)<1e10)return String(Number(x.toPrecision(12)));
 return Number(x.toPrecision(12)).toString();
}
function implicit(s){
 s=s.replace(/(\d|\)|π|Ans|[A-MX-Y])(?=(π|Ans|[A-MX-Y]|\())/g,"$1*");
 s=s.replace(/(\d|\)|π|Ans)(?=(sin|cos|tan|log|ln|Abs|sinh|cosh|tanh|asin|acos|atan))/g,"$1*");
 return s;
}
function transform(s){
 s=s.replace(/(\d+(?:\.\d+)?)P(\d+(?:\.\d+)?)/g,(m,n,r)=>"npr("+n+","+r+")");
 s=s.replace(/(\d+(?:\.\d+)?)C(\d+(?:\.\d+)?)/g,(m,n,r)=>"ncr("+n+","+r+")");
 s=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/π/g,"Math.PI").replace(/Ans/g,"("+ans+")");
 Object.keys(V).forEach(k=>{s=s.replace(new RegExp("\\b"+k+"\\b","g"),"("+V[k]+")")});
 s=s.replace(/(\d+(?:\.\d+)?)[Ee]([+\-]?\d+)/g,"($1*10**($2))");s=s.replace(/\be\b/g,"Math.E");
 s=s.replace(/√/g,"Math.sqrt");
 s=s.replace(/log/g,"Math.log10").replace(/ln/g,"Math.log").replace(/Abs/g,"Math.abs");
 s=s.replace(/sin⁻¹/g,"asin").replace(/cos⁻¹/g,"acos").replace(/tan⁻¹/g,"atan");
 s=s.replace(/sinh/g,"Math.sinh").replace(/cosh/g,"Math.cosh").replace(/tanh/g,"Math.tanh");
 s=s.replace(/asin/g,"INV_ASIN").replace(/acos/g,"INV_ACOS").replace(/atan/g,"INV_ATAN");
 s=s.replace(/sin/g,"Math.sin").replace(/cos/g,"Math.cos").replace(/tan/g,"Math.tan");
 s=s.replace(/INV_ASIN/g,"ASIN").replace(/INV_ACOS/g,"ACOS").replace(/INV_ATAN/g,"ATAN");
 s=s.replace(/ASIN\(([^()]*)\)/g,(m,x)=>"("+fromRadExpr("Math.asin("+x+")")+")");
 s=s.replace(/ACOS\(([^()]*)\)/g,(m,x)=>"("+fromRadExpr("Math.acos("+x+")")+")");
 s=s.replace(/ATAN\(([^()]*)\)/g,(m,x)=>"("+fromRadExpr("Math.atan("+x+")")+")");
 s=s.replace(/Math\.sin\(([^()]*)\)/g,(m,x)=>"Math.sin("+toRadExpr(x)+")");
 s=s.replace(/Math\.cos\(([^()]*)\)/g,(m,x)=>"Math.cos("+toRadExpr(x)+")");
 s=s.replace(/Math\.tan\(([^()]*)\)/g,(m,x)=>"Math.tan("+toRadExpr(x)+")");
 s=s.replace(/(\d+(?:\.\d+)?)!/g,(m,n)=>"fact("+n+")");
 s=s.replace(/\^/g,"**");
 return implicit(s);
}
function toRadExpr(x){return angle==="DEG"?"("+x+"*Math.PI/180)":angle==="GRAD"?"("+x+"*Math.PI/200)":"("+x+")"}
function fromRadExpr(x){return angle==="DEG"?"("+x+"*180/Math.PI)":angle==="GRAD"?"("+x+"*200/Math.PI)":"("+x+")"}
function evalExpr(s){
 let js=transform(s);
 if(!/^[0-9A-Za-z_+*/%().,\s*-]+$/.test(js))throw Error();
 return Function("fact","Math","npr","ncr","return ("+js+")")(fact,Math,npr,ncr);
}
function baseRadix(){return baseMode==="HEX"?16:baseMode==="BIN"?2:baseMode==="OCT"?8:10}
function baseFormat(v){
 const neg=v<0;let n=Math.abs(Math.trunc(v));
 let out=baseMode==="HEX"?n.toString(16).toUpperCase():baseMode==="BIN"?n.toString(2):baseMode==="OCT"?n.toString(8):String(n);
 return neg?"−"+out:out;
}
function baseCalculate(){
 try{
   if(!expr.trim())return;
   const radix=baseRadix();
   const js=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-")
     .replace(/([0-9A-F]+)/gi,m=>String(parseInt(m,radix)));
   if(!/^[0-9+*/%().\s-]+$/.test(js))throw Error();
   const v=Function("return ("+js+")")();
   if(typeof v!=="number"||!Number.isFinite(v)||!Number.isInteger(v))throw Error();
   ans=v;history.unshift({e:expr,r:v});history=history.slice(0,20);histPos=-1;
   $("result").textContent=baseFormat(v);expr="";render();
 }catch(e){$("result").textContent="Math ERROR"}
}
function selectBase(next){
 baseMode=next;if(mode!=="BASE")mode="BASE";
 if(Number.isFinite(ans))$("result").textContent=baseFormat(ans);
 expr="";render();
}
function calculate(){
 if(mode==="BASE")return baseCalculate();
 try{
   let v=evalExpr(expr);
   if(typeof v!=="number"||!Number.isFinite(v))throw Error();
   ans=v;history.unshift({e:expr,r:v});history=history.slice(0,20);histPos=-1;
   $("result").textContent=formatNumber(v);expr="";render();
 }catch(e){$("result").textContent="Math ERROR"}
}
function fraction(x){
 let sign=x<0?-1:1;x=Math.abs(x);let bestN=0,bestD=1,bestErr=Infinity;
 for(let d=1;d<=10000;d++){let n=Math.round(x*d),er=Math.abs(x-n/d);if(er<bestErr){bestErr=er;bestN=n;bestD=d}if(er<1e-10)break}
 let g=gcd(bestN,bestD);bestN/=g;bestD/=g;
 if(fractionMode==="a b/c"&&bestN>=bestD)return (sign<0?"-":"")+Math.floor(bestN/bestD)+" "+(bestN%bestD)+"/"+bestD;
 return (sign<0?"-":"")+bestN+"/"+bestD;
}
function menu(title,items,callback){
 let h=items.map((x,i)=>'<button class="choice" data-i="'+i+'">'+(i+1)+': '+x+'</button>').join("");
 $("title").textContent=title;$("choices").innerHTML=h;$("overlay").classList.add("show");
 [...$("choices").children].forEach(b=>b.onclick=()=>{callback(Number(b.dataset.i));$("overlay").classList.remove("show");render()});
}
function setup(){
 menu("SET-UP",["Maths","Line","Deg","Rad","Gra","Fix","Sci","Norm 1","Norm 2","a b/c","d/c","CPLX a+bi","CPLX r∠θ","STAT ON","STAT OFF","Dot","Comma","Reset"],i=>{
  if(i===0)io="MATH";if(i===1)io="LINE";if(i===2)angle="DEG";if(i===3)angle="RAD";if(i===4)angle="GRAD";
  if(i===5){display="FIX";window.fixDigits=Number(prompt("FIX decimal places (0-9)","2"))||0}
  if(i===6){display="SCI";window.sciDigits=Number(prompt("SCI significant digits (0-9)","6"))||0}
  if(i===7)display="NORM1";if(i===8)display="NORM2";if(i===9)fractionMode="a b/c";if(i===10)fractionMode="d/c";
  if(i===11)V.CPLX="a+bi";if(i===12)V.CPLX="r∠θ";
  if(i===17)allClear(),mode="COMP",angle="DEG",io="MATH",display="NORM1",fractionMode="d/c",baseMode="DEC";
 });
}
function modeMenu(){menu("MODE",["COMP","CPLX","STAT","BASE","EQN","TABLE","MATX","VCTR"],i=>{mode=["COMP","CPLX","STAT","BASE","EQN","TABLE","MATX","VCTR"][i];expr="";})}
function apps(){
 const map={
  COMP:["π","Σ","Max","Min","Q…r","Mod","LCM","GCD","nPr","nCr","!","Rand","i-Rand","Pol","Rec","Prime","d/dx","∫"],
  CPLX:["r∠θ","a+bi","Arg","Conjg","Real","Imag"],
  STAT:["Type","Data","Edit","S-SUM","S-VAR","S-PTS","Distr","Reg"],
  BASE:["and","or","Xor","Xnor","Not","Neg","DEC","HEX","BIN","OCT"],
  EQN:["2 unknown","3 unknown","4 unknown","Quad","Cubic","Quart"],
  TABLE:["f(x)","g(x)"],MATX:["Dim","Data","MatA","MatB","MatC","MatD","MatAns","Det","Trn","Ide","Adj","Inv"],
  VCTR:["Dim","Data","VctA","VctB","VctC","VctD","VctAns","Dot","Cross","Angle"]
 };
 const a=map[mode]||map.COMP;menu("APPS",a,i=>app(a[i]));
}
function dialog(title,html,run){
 $("title").textContent=title;$("choices").innerHTML=html;$("overlay").classList.add("show");
 $("choices").querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{try{run(b.dataset.run)}catch(e){$("result").textContent="Math ERROR"}$("overlay").classList.remove("show");render()});
}
function field(title,defs,run){
 let h=defs.map(d=>'<div class="field"><label>'+d[0]+'</label><input id="'+d[1]+'" value="'+(d[2]??"")+'"></div>').join("");
 h+='<button class="choice" data-run="go">OK</button>';dialog(title,h,run);
}
let statX=[],statY=[],mat={A:[[0]],B:[[0]],C:[[0]],D:[[0]],Ans:[[0]]},vec={A:[0,0],B:[0,0],C:[0,0],D:[0,0],Ans:[0,0]};
function app(n){
 if(n==="π")return add("π");
 if(n==="!")return add("!");
 if(n==="nPr"||n==="nCr")return field(n,[["n","a","5"],["r","b","2"]],()=>{$("result").textContent=formatNumber(n==="nPr"?npr(+$("a").value,+$("b").value):ncr(+$("a").value,+$("b").value))});
 if(n==="Σ")return field("Σ",[["f(x)","f","x+1"],["Start","a","1"],["End","b","5"]],()=>{let s=0,f=$("f").value;for(let x=+$("a").value;x<=+$("b").value;x++)s+=evalExpr(f.replace(/x/g,"("+x+")"));ans=s;$("result").textContent=formatNumber(s)});
 if(n==="Max"||n==="Min")return field(n,[["Values","v","1,2,3"]],()=>{let a=$("v").value.split(",").map(Number);ans=n==="Max"?Math.max(...a):Math.min(...a);$("result").textContent=formatNumber(ans)});
 if(n==="Q…r")return field("Q…r",[["A","a","17"],["B","b","5"]],()=>{let a=+$("a").value,b=+$("b").value,q=Math.trunc(a/b),r=a-q*b;$("result").textContent="Q="+q+"  r="+r;ans=q});
 if(n==="Mod")return field("Mod",[["A","a","17"],["B","b","5"]],()=>{$("result").textContent=formatNumber(+$("a").value%+$("b").value)});
 if(n==="LCM"||n==="GCD")return field(n,[["A","a","12"],["B","b","18"]],()=>{$("result").textContent=formatNumber(n==="LCM"?lcm(+$("a").value,+$("b").value):gcd(+$("a").value,+$("b").value))});
 if(n==="Rand"){ans=Math.random();return $("result").textContent=ans.toFixed(3)}
 if(n==="i-Rand")return field("i-Rand",[["From","a","1"],["To","b","10"]],()=>{$("result").textContent=String(Math.floor(+$("a").value+Math.random()*(+$("b").value-+$("a").value+1)))});
 if(n==="Pol"||n==="Rec")return field(n,[["A","a","3"],["B","b","4"]],()=>{let a=+$("a").value,b=+$("b").value;if(n==="Pol")$("result").textContent="r="+formatNumber(Math.hypot(a,b))+"  θ="+formatNumber(fromRad(Math.atan2(b,a)));else $("result").textContent="x="+formatNumber(a*Math.cos(rad(b)))+"  y="+formatNumber(a*Math.sin(rad(b)))});
 if(n==="Prime")return field("Prime Factorization",[["N","n","9999"]],()=>{let v=Math.trunc(+$("n").value),out=[],d=2;while(v>1&&d*d<=v){while(v%d===0){out.push(d);v/=d}d++}if(v>1)out.push(v);$("result").textContent=out.join(" × ")});
 if(n==="d/dx")return field("Differential",[["f(x)","f","x²"],["x","x","2"],["Δx","h","0.000001"]],()=>{let f=t=>evalExpr($("f").value.replace(/x/g,"("+t+")").replace(/²/g,"^2")),x=+$("x").value,h=+$("h").value;ans=(f(x+h)-f(x-h))/(2*h);$("result").textContent=formatNumber(ans)});
 if(n==="∫")return field("Integration",[["f(x)","f","x²"],["a","a","0"],["b","b","1"]],()=>{let f=t=>evalExpr($("f").value.replace(/x/g,"("+t+")").replace(/²/g,"^2")),a=+$("a").value,b=+$("b").value,N=1000,h=(b-a)/N,s=f(a)+f(b);for(let i=1;i<N;i++)s+=(i%2?4:2)*f(a+i*h);ans=s*h/3;$("result").textContent=formatNumber(ans)});
 if(mode==="CPLX")return complex(n);if(mode==="BASE")return base(n);if(mode==="STAT")return statistics(n);if(mode==="EQN")return equation(n);if(mode==="TABLE")return table(n);if(mode==="MATX")return matrix(n);if(mode==="VCTR")return vector(n);
}
function complex(n){return field("CPLX "+n,[["z","z","3+4i"]],()=>{let s=$("z").value.replace(/\s/g,""),a=0,b=0;if(s.includes("∠")){let q=s.split("∠");a=+q[0]*Math.cos(rad(+q[1]));b=+q[0]*Math.sin(rad(+q[1]))}else{let m=s.match(/^([+-]?\d*\.?\d+)?([+-]\d*\.?\d+)?i?$/);if(!m)throw Error();a=+(m[1]||0);b=+(m[2]||0)}if(n==="Arg")$("result").textContent=formatNumber(fromRad(Math.atan2(b,a)));else if(n==="Conjg")$("result").textContent=a+(b<0?" + ":" - ")+Math.abs(b)+"i";else if(n==="Real")$("result").textContent=formatNumber(a);else if(n==="Imag")$("result").textContent=formatNumber(b);else if(n==="r∠θ")$("result").textContent=formatNumber(Math.hypot(a,b))+"∠"+formatNumber(fromRad(Math.atan2(b,a)));else $("result").textContent=formatNumber(a)+(b<0?" - ":" + ")+formatNumber(Math.abs(b))+"i"})}
function base(n){
 if(["DEC","HEX","BIN","OCT"].includes(n))return selectBase(n);
 return field(n,[["A","a","10"],["B","b","3"]],()=>{
   const radix=baseRadix();
   const parseBase=v=>{const s=String(v).trim();if(!/^[+-]?[0-9A-F]+$/i.test(s))throw Error();const digits=s.replace(/^[-+]/,"").toUpperCase();if([...digits].some(ch=>parseInt(ch,16)>=radix))throw Error();return parseInt(s,radix)};
   const a=parseBase($("a").value), b=parseBase($("b").value);
   let v=n==="and"?(a&b):n==="or"?(a|b):n==="Xor"?(a^b):n==="Xnor"?~(a^b):n==="Neg"?-a:~a;
   ans=v; $("result").textContent=baseFormat(v);
 });
}
function statistics(n){if(n==="Type")return menu("STAT TYPE",["SD","Lin","Quad","Log","e EXP","ab EXP","Pwr","Inv"],()=>{});if(n==="Data"||n==="Edit")return field("STAT DATA",[["x","x","75,85,90,77,79"],["y","y","38,54,59,40,38"]],()=>{statX=$("x").value.split(",").map(Number);statY=$("y").value.split(",").map(Number);$("result").textContent=statX.length+" DATA"});if(n==="S-SUM"||n==="S-VAR"){if(!statX.length)return $("result").textContent="NO DATA";let s=statX.reduce((a,b)=>a+b,0),m=s/statX.length,ss=statX.reduce((a,b)=>a+(b-m)**2,0);$("result").textContent=n==="S-SUM"?"Σx="+s+"\\nΣx²="+statX.reduce((a,b)=>a+b*b,0):"x̄="+m+"\\nsx="+Math.sqrt(ss/(statX.length-1))+"\\nσx="+Math.sqrt(ss/statX.length);return}if(n==="S-PTS")return $("result").textContent=statX.length?"n="+statX.length:"NO DATA";if(n==="Reg"){if(!statX.length)return $("result").textContent="NO DATA";let N=Math.min(statX.length,statY.length),sx=0,sy=0,sxx=0,sxy=0,syy=0;for(let i=0;i<N;i++){sx+=statX[i];sy+=statY[i];sxx+=statX[i]**2;sxy+=statX[i]*statY[i];syy+=statY[i]**2}let B=(N*sxy-sx*sy)/(N*sxx-sx*sx),A=(sy-B*sx)/N,r=(N*sxy-sx*sy)/Math.sqrt((N*sxx-sx*sx)*(N*syy-sy*sy));$("result").textContent="A="+A+"\\nB="+B+"\\nr="+r;return}if(n==="Distr")return field("Distribution",[["t","t","0"]],()=>{let t=+$("t").value,p=.5*(1+erf(t/Math.sqrt(2)));$("result").textContent="P="+p+"\\nQ="+(1-p)+"\\nR="+Math.abs(2*p-1)})}
function erf(x){let s=x<0?-1:1;x=Math.abs(x);let t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
function equation(n){let d=n==="Quad"?2:n==="Cubic"?3:n==="Quart"?4:2;return field("EQN "+n,[["Coefficients","c",d===2?"1,-5,6":"1,0,0,-1"]],()=>{let c=$("c").value.split(",").map(Number);if(d===2){let D=c[1]**2-4*c[0]*c[2];if(D<0)return $("result").textContent="Complex roots";$("result").textContent="x1="+formatNumber((-c[1]+Math.sqrt(D))/(2*c[0]))+"\\nx2="+formatNumber((-c[1]-Math.sqrt(D))/(2*c[0]))}else $("result").textContent="Polynomial degree "+d+" accepted; numeric root pass pending"})}
function table(n){return field("TABLE",[["f(x)","f","x²+3x-2"],["g(x)","g",""],["Start","s","1"],["End","e","5"],["Step","st","1"]],()=>{let f=$("f").value.replace(/x/g,"("+0+")").replace(/²/g,"^2"),g=$("g").value,s=+$("s").value,e=+$("e").value,st=+$("st").value,out="x   f(x)"+(g?"   g(x)":"");for(let x=s,i=0;x<=e&&i<30;i++,x+=st){let fx=evalExpr($("f").value.replace(/x/g,"("+x+")").replace(/²/g,"^2"));out+="\\n"+x+"   "+fx;if(g)out+="   "+evalExpr(g.replace(/x/g,"("+x+")"))}$("result").textContent=out})}
function trans(a){return a[0].map((_,j)=>a.map(r=>r[j]))}
function det(a){if(a.length!==a[0].length)throw Error();if(a.length===1)return a[0][0];if(a.length===2)return a[0][0]*a[1][1]-a[0][1]*a[1][0];return a[0].reduce((s,v,j)=>s+(-1)**j*v*det(a.slice(1).map(r=>r.filter((_,k)=>k!==j))),0)}
function inv(a){let n=a.length,m=a.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));if(n!==a[0].length)throw Error();for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(m[j][i])>Math.abs(m[p][i]))p=j;if(Math.abs(m[p][i])<1e-12)throw Error();[m[i],m[p]]=[m[p],m[i]];let q=m[i][i];m[i]=m[i].map(v=>v/q);for(let j=0;j<n;j++)if(j!==i){q=m[j][i];m[j]=m[j].map((v,k)=>v-q*m[i][k])}}return m.map(r=>r.slice(n))}
function matrix(n){return field("MATX "+n,[["Matrix rows; columns comma-separated","v","1,2;3,4"]],()=>{let a=$("v").value.split(";").map(r=>r.split(",").map(Number)),z=n==="Det"?det(a):n==="Trn"?trans(a):n==="Inv"?inv(a):n==="Ide"?a.map((r,i)=>r.map((_,j)=>i===j?1:0)):a;$("result").textContent=JSON.stringify(z)})}
function vector(n){return field("VCTR "+n,[["A","a","1,2,3"],["B","b","4,5,6"]],()=>{let a=$("a").value.split(",").map(Number),b=$("b").value.split(",").map(Number);if(n==="Dot")$("result").textContent=a.reduce((s,v,i)=>s+v*b[i],0);else if(n==="Cross"){let z=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];$("result").textContent=JSON.stringify(z)}else if(n==="Angle")$("result").textContent=formatNumber(fromRad(Math.acos(a.reduce((s,v,i)=>s+v*b[i],0)/(Math.hypot(...a)*Math.hypot(...b)))));})}
function solve(){return field("SOLVE",[["Equation in X","q","x²-5x+6"],["Initial X","x","1"]],()=>{let q=$("q").value.replace(/²/g,"^2"),x=+$("x").value;for(let i=0;i<50;i++){let f=t=>evalExpr(q.replace(/x/g,"("+t+")")),h=1e-6,df=(f(x+h)-f(x-h))/(2*h);if(Math.abs(df)<1e-14)throw Error();let nx=x-f(x)/df;if(Math.abs(nx-x)<1e-10){x=nx;break}x=nx}ans=x;$("result").textContent=formatNumber(x)})}
$("shift").onclick=()=>{shift=!shift;alpha=false;render()};
$("alpha").onclick=()=>{alpha=!alpha;shift=false;render()};
$("mode").onclick=()=>shift?(shift=false,setup()):modeMenu();
$("apps").onclick=apps;$("cancel").onclick=()=>$("overlay").classList.remove("show");
$("up").onclick=()=>{};$("down").onclick=()=>{};
$("left").onclick=()=>{if(history.length){histPos=Math.min(history.length-1,histPos+1);expr=history[histPos].e;render()}};
$("right").onclick=()=>{if(history.length){histPos=Math.max(-1,histPos-1);expr=histPos<0?"":history[histPos].e;render()}};
$("on").onclick=clearEntry;$("ca").onclick=allClear;$("del").onclick=()=>{expr=expr.slice(0,-1);render()};
$("equals").onclick=calculate;$("ans").onclick=()=>add("Ans");$("ansTop").onclick=()=>add("Ans");
$("convt").onclick=()=>field("CONVT",[["Value","v","5"]],()=>{$("result").textContent=$("v").value});

function doShift(action){
 if(action==="asin")add("sin⁻¹(");else if(action==="acos")add("cos⁻¹(");else if(action==="atan")add("tan⁻¹(");
 else if(action==="fraction")$("result").textContent=fraction(ans);
 else if(action==="pow10")add("10^(");else if(action==="powe")add("e^(");
 else if(action==="npr")add("P");else if(action==="ncr")add("C");else if(action==="x!")add("!");else if(action==="percent")add("%");else if(action==="mminus"){memory-=ans;render()}
 else if(action==="sum")$("result").textContent="Σ";else if(action==="drg")$("result").textContent="DRG▶";
 else if(action==="round")$("result").textContent=Math.round(ans);else if(action==="rand"){ans=Math.random();$("result").textContent=ans.toFixed(3)}
 else if(action==="pi")add("π");else if(action==="eng"){if(ans===0)$("result").textContent="0";else{const p=Math.floor(Math.log10(Math.abs(ans))/3)*3;$("result").textContent=(ans/10**p)+"×10^"+p}}
 else if(action==="solve")solve();else if(action==="inv")add("!");
 else if(action==="," )add(",");
 else if(action==="CALC")solve();
}
function baseDigitAllowed(ch){
 const u=String(ch).toUpperCase();
 if(!/^[0-9A-F]$/.test(u)) return true;
 const d=parseInt(u,16);
 return d < baseRadix();
}
function baseAppend(value){
 const s=String(value);
 if(s==="." || /[Ee]/.test(s)) return;
 if([...s].some(ch=>/[0-9A-F]/i.test(ch) && !baseDigitAllowed(ch))) return;
 add(s);
}
function pressButton(b){
 const alphaVal=b.dataset.alpha, shiftVal=b.dataset.shift;
 if(mode==="BASE" && b.dataset.base){selectBase(b.dataset.base);return;}

 if(alpha && alphaVal!==undefined){
   if(mode==="BASE"){
     if(baseMode==="HEX" && /^[A-F]$/.test(alphaVal)) add(alphaVal);
     alpha=false;render();return;
   }
   add(alphaVal);alpha=false;render();return;
 }
 if(shift){
   if(shiftVal!==undefined){
     if(mode==="BASE"){
       const blocked=["x!","pow10","powe","asin","acos","atan","npr","ncr","percent","mminus","sum","drg","round","rand","pi","eng","solve",",","CALC","inv"];
       const sv=shiftVal;shift=false;
       if(!blocked.includes(sv)){doShift(sv)}else{render()}
       return;
     }
     const sv=shiftVal;shift=false;doShift(sv);render();return
   }
   shift=false;render();
 }
 const a=b.dataset.action;
 if(a==="calc")solve();else if(a==="inv")add("1/(");else if(a==="fraction")$("result").textContent=fraction(ans);
 else if(a==="eng")doShift("eng");else if(a==="sqrt")add("√(");else if(a==="square")add("^2");else if(a==="cube")add("^3");
 else if(a==="log")add("log(");else if(a==="ln")add("ln(");else if(a==="neg")add("−");else if(a==="exp")add("E");else if(a==="dms")add("°′″");
 else if(a==="hyp")add("sinh(");else if(a==="sin")add("sin(");else if(a==="cos")add("cos(");else if(a==="tan")add("tan(");
 else if(a==="rcl")add(String(memory));else if(a==="abs")add("Abs(");else if(a==="mplus"){memory+=ans;render()}
 else if(a===undefined && b.dataset.v!==undefined){
   if(mode==="BASE") baseAppend(b.dataset.v); else add(b.dataset.v);
 }
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>pressButton(b));
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>pressButton(b));
render();

let b3Store=false,b3Recall=false,b3DmsStage=0;
function b3DmsToDecimal(s){return s.replace(/(\d+(?:\.\d+)?)°(?:\s*(\d+(?:\.\d+)?)′)?(?:\s*(\d+(?:\.\d+)?)″)?/g,(m,d,mi='0',se='0')=>String(+d+(+mi)/60+(+se)/3600));}
function b3Pol(x,y){return Math.hypot(x,y);}
function b3Rec(r,t){return r*Math.cos(rad(t));}
function b3Calculate(){
 try{let source=b3DmsToDecimal(expr).replace(/Pol\(([^,]+),([^\)]+)\)/g,(m,x,y)=>String(b3Pol(evalExpr(x),evalExpr(y)))).replace(/Rec\(([^,]+),([^\)]+)\)/g,(m,r,t)=>String(b3Rec(evalExpr(r),evalExpr(t))));expr=source;calculate();}
 catch(e){$("result").textContent="Math ERROR"}
}
function b3VariableButton(b){
 const old=b.onclick;
 b.onclick=()=>{const k=b.dataset.alpha;if(b3Store){V[k]=ans;b3Store=false;alpha=false;render();return}if(b3Recall){add(String(V[k]??0));b3Recall=false;alpha=false;render();return}old();};
}
const b3Rcl=document.querySelector('[data-action="rcl"]');
if(b3Rcl){b3Rcl.onclick=()=>{if(shift){b3Store=true;b3Recall=false;shift=false;render();return}b3Recall=true;render();};}
for(const b of document.querySelectorAll('[data-alpha]')) b3VariableButton(b);
const b3Plus=document.querySelector('[data-v="+"]');
if(b3Plus){const old=b3Plus.onclick;b3Plus.onclick=()=>{if(shift){add('Pol(');shift=false;render();return}old();};}
const b3Minus=document.querySelector('[data-v="−"]');
if(b3Minus){const old=b3Minus.onclick;b3Minus.onclick=()=>{if(shift){add('Rec(');shift=false;render();return}old();};}
const b3Paren=document.querySelector('[data-v=")"]');
if(b3Paren){const old=b3Paren.onclick;b3Paren.onclick=()=>{if(shift){add(',');shift=false;render();return}old();};}
const b3Dms=document.querySelector('[data-action="dms"]');
if(b3Dms){b3Dms.onclick=()=>{const mark=b3DmsStage===0?'°':b3DmsStage===1?'′':'″';add(mark);b3DmsStage=(b3DmsStage+1)%3;};}
for(const id of ['ans','ansTop']){const b=$(id);if(b){b.onclick=()=>{if(shift){const old=angle;const v=ans;const next=old==='DEG'?'RAD':old==='RAD'?'GRAD':'DEG';ans=old==='DEG'?v*Math.PI/180:old==='RAD'?v*200/Math.PI:v*180/200;angle=next;shift=false;$("result").textContent=formatNumber(ans);render();return}add('Ans');};}}
$("equals").onclick=b3Calculate;

})();
